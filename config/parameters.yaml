project:
  name: BECPA-IoV
  random_seed: 42
  output_dir: results

dataset:
  # Put the extracted InTAS_highway_2 files under dataset/raw/.
  # The starter parser attempts to discover vehicle records in JSON files.
  use_dataset: true
  raw_dir: dataset/raw
  ground_truth_dir: dataset/raw
  fallback_vehicle_count: 100
  fallback_malicious_ratio: 0.10

simulation:
  vehicle_counts: [25, 50, 75, 100, 150, 200]
  batch_size: 10
  messages_per_vehicle: 1
  attack_scenarios: [normal, dos, replay, sybil, position_offset]

crypto:
  curve: SECP256k1
  # Demonstration Schnorr-style aggregate signatures over registered vehicle keys.
  # This is a research prototype, not a production cryptographic implementation.

energy:
  vehicle_cpu_power_w: 1.5
  rsu_cpu_power_w: 12.0
  tx_power_w: 1.8
  rx_power_w: 1.0
  tx_energy_j_per_bit: 0.00000000005
  rx_energy_j_per_bit: 0.00000000002
  blockchain_node_power_w: 15.0
  blockchain_commit_seconds: 0.002
  beacon_bytes: 96
  message_bytes: 256
  signature_bytes: 64
  registration_tx_bytes: 180
  aggregate_proof_bytes: 160
  revocation_tx_bytes: 192

blockchain:
  validators: 4
  quorum: 3
  transaction_processing_seconds: 0.002
